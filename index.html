<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>誠品之夜：精神補給艙提案 (手機直式版)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        /* 1. 誠品核心視覺識別 (VI) 設定 */
        :root {
            --eslite-green: #006837;      /* 誠品經典墨綠 */
            --eslite-wood: #2c241e;       /* 沉穩木質黑 */
            --eslite-cream: #f9f7f2;      /* 人文米白 */
            --eslite-charcoal: #222222;   /* 印刷級深灰 */
            --eslite-gold: #c5a47e;       /* 典雅銅金 */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1a1a1a;
            font-family: 'Noto Sans TC', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px 0;
            min-height: 100vh;
        }

        /* 直式手機簡報外殼模擬 */
        .slide-container {
            width: 412px;
            height: 892px;
            background-color: var(--eslite-cream);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 45px 30px;
            border: 1px solid #dcd7cd;
        }

        /* 誠品經典美學：書架細線背景 */
        .slide-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(to right, rgba(44, 36, 30, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(44, 36, 30, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
            pointer-events: none;
        }

        /* 誠品精神小方塊標記 */
        .eslite-marker {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: var(--eslite-green);
            margin-right: 8px;
            vertical-align: middle;
        }

        .slide-container > * {
            position: relative;
            z-index: 1;
        }

        /* 頁碼樣式 */
        .slide-number {
            font-family: 'Noto Serif TC', serif;
            font-size: 14px;
            color: var(--eslite-gold);
            text-align: right;
            border-bottom: 1px solid rgba(197, 164, 126, 0.3);
            padding-bottom: 5px;
            width: 100%;
            letter-spacing: 2px;
        }

        /* 2. 字體與排版 */
        h1, h2, h3 {
            font-family: 'Noto Serif TC', serif;
            color: var(--eslite-charcoal);
            font-weight: 700;
        }

        .slide-title {
            font-size: 28px;
            line-height: 1.3;
            margin-top: 25px;
            margin-bottom: 20px;
            border-left: 4px solid var(--eslite-green);
            padding-left: 12px;
            letter-spacing: 1px;
        }

        p, li, td {
            font-size: 15px;
            line-height: 1.7;
            color: #444444;
            font-weight: 300;
            text-align: justify;
        }

        strong {
            font-weight: 500;
            color: var(--eslite-green);
        }

        .highlight-text {
            color: #bd925a;
            font-weight: 600;
        }

        /* 3. 組件樣式 */
        .content-body {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .info-card {
            background: white;
            border: 1px solid #e8e3d9;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(44,36,30,0.02);
        }

            font-size: 18px;
            color: var(--eslite-green);
            margin-bottom: 8px;
